[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-rag"
version = "0.1.0"
description = "学习用的 RAG 单体实现"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # embedding_api / rerank_api 共用的异步 HTTP 客户端
    # （DoubaoEmbeddingVision、AliyunReranker）
    "httpx",
    "python-dotenv",
    "sqlite-vec",
    # tokenization 的内置分词器。**硬依赖，不是 extra** ——
    # tokenization/__init__.py 在 import 时加载它，做成 extra 会让默认安装下
    # `import simple_rag.tokenization` 直接 ModuleNotFoundError
    "jieba",
    # bm25 的 rank_bm25 实现。与 jieba 同理是硬依赖 ——
    # `create_bm25("rank_bm25", ...)` 要在 import 期就拿到 BM25Okapi
    "rank_bm25",
]

[project.optional-dependencies]
dev = ["pytest"]

# 只把 simple_rag 当作模块打包 —— 根目录的 docs/ 与 tests/ 不是包
[tool.setuptools.packages.find]
include = ["simple_rag*"]

[tool.pytest.ini_options]
# 让 `pytest`（不带 -m）也能 import 到 simple_rag：
# 直接调 pytest 时 CWD 不会自动进 sys.path，只有 `python -m pytest` 才会。
pythonpath = ["."]
# 测试全部在根 tests/ 下，按 simple_rag/ 的结构镜像摆放
testpaths = ["tests"]
